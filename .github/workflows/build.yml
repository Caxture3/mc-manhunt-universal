name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.11', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build selected Minecraft version
        run: bash ./gradlew build -PmcVersion=${{ matrix.minecraft }} --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: manhunt-universal-mc${{ matrix.minecraft }}
          path: |
            paper/${{ matrix.minecraft }}/build/libs/*.jar
            fabric/${{ matrix.minecraft }}/build/libs/*.jar
          if-no-files-found: error

